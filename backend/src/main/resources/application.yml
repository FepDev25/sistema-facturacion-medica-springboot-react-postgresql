spring:
  application:
    name: sfm-backend

  # JPA / Hibernate
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

  # Flyway - configuracion base (la URL/user/pass vienen del perfil activo)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # Redis - configuracion base (host/puerto vienen del perfil activo)
  data:
    redis:
      timeout: 2000ms

  # Spring AI — configuración base
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          # Tareas estructuradas (extraccion, reranking, sugerencias): temperatura 0
          temperature: 0.0
          max-tokens: 2048
    google:
      genai:
        embedding:
          api-key: ${GOOGLE_API_KEY:}
          text:
            options:
              model: gemini-embedding-001
              task-type: RETRIEVAL_DOCUMENT
              dimensions: 768

# JWT - propiedades custom del proyecto
app:
  ai:
    # Limite por usuario para endpoints /api/v1/ai/** (ventana fija de 1 minuto)
    rate-limit:
      requests-per-minute: 20
    # Timeout por llamada al LLM y reintentos ante errores transitorios
    timeout-seconds: 30
    max-retries: 1
  jwt:
    # Clave generica de desarrollo. REEMPLAZAR por variable de entorno en produccion.
    secret: c2ZtLXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LXVzZS1vbmx5LTI1NmJpdHM=
    access-token-expiration: 900000      # 15 minutos en milisegundos
    refresh-token-expiration: 604800000  # 7 dias en milisegundos
  auth:
    # Cookies httpOnly. En produccion se fuerzan Secure (ver application-prod.yml).
    cookies:
      secure: false
      same-site: Strict
    refresh:
      # Ventana para refresh concurrentes entre pestañas. Fuera de ella, reusar un
      # token ya canjeado revoca la familia completa.
      grace-seconds: 15
    login:
      # Ventana fija de 5 minutos: 10 fallos por identidad o 30 por IP.
      max-attempts: 10
      max-attempts-per-ip: 30
      window-seconds: 300

  

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized
