name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Desplegar a producción si CI pasa"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # En PRs conviene cancelar corridas viejas. En main no, para no cortar
  # un deploy a mitad de camino.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HEROKU_APP: ${{ vars.HEROKU_APP || 'sfm-backend-fepdev' }}
  PROD_URL: ${{ vars.PROD_URL || 'https://sfm-backend-fepdev-a04e4eeac708.herokuapp.com' }}
  PROD_HEALTH_URL: ${{ vars.PROD_HEALTH_URL || 'https://sfm-backend-fepdev-a04e4eeac708.herokuapp.com/actuator/health' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Tests y cobertura
        working-directory: backend
        run: |
          set -o pipefail
          ./mvnw -B -ntp verify 2>&1 | tee /tmp/mvn-verify.log

      - name: Resumir fallos de tests
        if: failure()
        run: |
          python3 - <<'PY'
          import pathlib

          log = pathlib.Path('/tmp/mvn-verify.log')
          lines = log.read_text(errors='replace').splitlines() if log.exists() else []
          errors = [line.rstrip() for line in lines if line.startswith('[ERROR]')]
          selected = errors[-25:] if errors else lines[-1:]

          if not selected:
              selected = ['mvn verify falló sin salida']

          for line in selected:
              message = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=Maven::{message}')
          PY

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests y cobertura
        run: npm run test:coverage

      - name: Build de producción
        run: npm run build

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    environment:
      name: production
      url: ${{ vars.PROD_URL || 'https://sfm-backend-fepdev-a04e4eeac708.herokuapp.com' }}
    concurrency:
      group: deploy-backend-production
      cancel-in-progress: false
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Heroku CLI
        run: curl -fsSL https://cli-assets.heroku.com/install.sh | sh

      - name: Verificar Heroku CLI
        run: heroku --version

      - name: Verificar acceso a la app
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          echo "App configurada: $HEROKU_APP"
          if ! heroku apps:info --app "$HEROKU_APP" >/dev/null 2>&1; then
            echo "::error title=Heroku::La API key configurada no puede acceder a la app $HEROKU_APP"
            exit 1
          fi

      - name: Login al registry de Heroku
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build y push de la imagen
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64
          provenance: false
          sbom: false
          outputs: type=image,name=registry.heroku.com/${{ env.HEROKU_APP }}/web,push=true,oci-mediatypes=false

      - name: Release
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: heroku container:release web --app "$HEROKU_APP"

      - name: Smoke test de producción
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$PROD_HEALTH_URL" || true)
            if [ "$status" = "200" ]; then
              echo "Health check OK en el intento $i."
              exit 0
            fi
            echo "Intento $i/30: HTTP $status"
            sleep 10
          done
          echo "Producción no respondió 200 en $PROD_HEALTH_URL"
          exit 1

      - name: Resumen del deploy
        if: always()
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          {
            echo "## Deploy backend"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- App: \`$HEROKU_APP\`"
            echo "- Health: $PROD_HEALTH_URL"
            echo ""
            echo "Rollback: \`heroku releases:rollback -a $HEROKU_APP\`"
          } >> "$GITHUB_STEP_SUMMARY"
          heroku releases --app "$HEROKU_APP" --num 3 || true
