name: E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright
    # Playwright 1.59 todavía no soporta las dependencias de Ubuntu 26.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: fac_med_db
          POSTGRES_USER: sfm
          POSTGRES_PASSWORD: sfm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sfm -d fac_med_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_ADMIN_USER: admin
      E2E_ADMIN_PASS: admin123
      E2E_DOCTOR_USER: doctor1
      E2E_DOCTOR_PASS: doctor123
      E2E_RECEPTIONIST_USER: recep1
      E2E_RECEPTIONIST_PASS: recep123
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilar backend
        working-directory: backend
        run: ./mvnw -B -ntp -Dmaven.test.skip=true package

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Esperar PostgreSQL y Redis
        run: |
          for i in $(seq 1 30); do
            pg=0
            redis=0
            (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && pg=1
            (echo > /dev/tcp/127.0.0.1/6379) 2>/dev/null && redis=1
            if [ "$pg" = "1" ] && [ "$redis" = "1" ]; then
              echo "Servicios listos."
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL o Redis no respondieron."
          exit 1

      - name: Iniciar backend
        working-directory: backend
        run: |
          JAR=$(find target -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n 1)
          test -n "$JAR"
          echo "Usando $JAR"
          nohup java -jar "$JAR" \
            --spring.profiles.active=ci \
            --spring.config.additional-location="file:$GITHUB_WORKSPACE/backend/ci/" \
            > /tmp/e2e-backend.log 2>&1 &
          echo $! > /tmp/e2e-backend.pid

      - name: Esperar backend
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null; then
              echo "Backend listo."
              exit 0
            fi
            sleep 2
          done
          echo "El backend no respondió."
          tail -n 120 /tmp/e2e-backend.log
          exit 1

      - name: Build del frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://127.0.0.1:8080/api/v1
        run: npm run build

      - name: Iniciar frontend
        working-directory: frontend
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 5173 --strictPort \
            > /tmp/e2e-frontend.log 2>&1 &
          echo $! > /tmp/e2e-frontend.pid

      - name: Esperar frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              echo "Frontend listo."
              exit 0
            fi
            sleep 2
          done
          echo "El frontend no respondió."
          tail -n 80 /tmp/e2e-frontend.log
          exit 1

      - name: Ejecutar Playwright
        working-directory: frontend
        run: npm run e2e

      - name: Mostrar logs
        if: failure()
        run: |
          echo "=== backend ==="
          tail -n 120 /tmp/e2e-backend.log || true
          echo "=== frontend ==="
          tail -n 80 /tmp/e2e-frontend.log || true

      - name: Publicar artefactos
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            frontend/test-results/
            frontend/playwright-report/
            /tmp/e2e-backend.log
            /tmp/e2e-frontend.log
          if-no-files-found: ignore
          retention-days: 7
